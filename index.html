@media (max-width:480px){.lt{width:30px;height:38px;font-size:14px}.lt.open{font-size:20px}}
.wide{max-width:1280px!important}
.links{display:grid;gap:2px;min-width:0}.link{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.link .yr{flex:none;font-size:12px;font-weight:700;background:var(--steel-bg);border-radius:20px;padding:1px 9px}.link p{margin:0;font-size:15px}
.arr{text-align:center;color:var(--poppy);font-weight:700;line-height:1}
.three{display:grid;gap:6px}.three details{background:#fff}
.lane{border-radius:14px;padding:12px 14px;display:grid;gap:10px;border:1px solid var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.ccard{border:1.5px solid #CDBEA6;background:#fff;border-radius:10px;padding:8px 11px;font-size:14.5px;text-align:left;color:var(--ink)}
.ccard.on{width:100%}.ccard.right{border-color:#5E7238;background:#E8EDD8}.ccard.wrong{border-color:var(--poppy);background:var(--poppy-bg)}
.placed{margin:0;padding-left:22px;display:grid;gap:5px;min-height:10px}
.placed li::marker{font-weight:700;color:var(--soft)}
.diag{background:var(--brass-bg);border-radius:10px;padding:10px 14px;font-size:14px}
.key{max-width:250px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap}
.ctabs button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;line-height:1.3;text-align:center}
.ctabs button small{display:block;font-weight:400;font-size:12px;color:var(--soft)}
.ctabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}.ctabs button[aria-selected=true] small{color:#E9DFCF}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;align-items:start}
.pcard{background:#fff;border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0;box-shadow:0 2px 6px #0000000d}
.pcard header{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:baseline}.pcard header b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gc)}
.pcard.empty{background:transparent;border-style:dashed;box-shadow:none;color:var(--soft)}
.rl{list-style:none;margin:0;padding:0;display:grid;gap:7px}.rl li{display:grid;gap:2px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.rl li b{font-size:12.5px;color:var(--soft)}.rl li span{justify-self:start;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:20px}.rl li p{margin:0;white-space:pre-wrap}
.concl{background:var(--olive-bg);border-radius:9px;padding:8px 10px;display:grid;gap:4px;font-size:14px}.concl p{margin:0;white-space:pre-wrap}.concl b{color:#3F4E22;margin-right:4px}
label .oppq{font-weight:700;font-size:15px;color:var(--ink)}
.older summary{font-size:13px;color:var(--soft)}.old1{border-top:1px solid var(--line);padding-top:6px;margin-top:6px;display:grid;gap:6px;opacity:.85}
.posts{display:grid;gap:12px}
.post-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:grid;gap:9px;min-width:0}
.post-card legend{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:0 4px}
.avatar{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;align-items:center;justify-content:center}
.ptext{font-size:16px;background:var(--paper);border-radius:10px;padding:10px 12px}
.techs{display:flex;flex-wrap:wrap;gap:6px}.techs .grpbtn span{font-size:14px;padding:5px 11px}
input[type=text]{width:100%;background:#fff;border:1.5px solid #CDBEA6;border-radius:9px;padding:9px 12px;font-weight:400;font-size:15px}
.source blockquote small{color:var(--soft)}
.clock{display:inline-block;font-size:12px;font-weight:700;letter-spacing:0;background:var(--brass-bg);color:#6F4E10;border-radius:20px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.tb{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}.tb th,.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left}.tb th{background:var(--paper)}
.fig{margin:0;display:grid;gap:6px;min-width:0}
.zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;cursor:zoom-in}
.zoom img{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--soft)}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:center}
.narrow{max-width:420px;justify-self:center;width:100%}
.act{border:1.5px solid var(--steel);border-radius:14px;padding:14px 16px;display:grid;gap:9px;background:var(--steel-bg)}
.act h3{font-size:18px}.act .tag{font-size:12px;font-weight:700;color:var(--steel)}
.act details{background:#fff;border-style:solid;border-color:#C3D3DF}
#lb{position:fixed;inset:0;z-index:20;background:#14100CE6;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out;border:0;width:100%}
#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.lanebtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}.lanebtns span{font-weight:700;font-size:14px}
.lanebtns button,.seg button{border:1.5px solid #CDBEA6;background:#fff;border-radius:9px;padding:7px 12px;font-weight:700;color:var(--ink);font-size:14px}
.lanebtns button[aria-pressed=true]{background:var(--steel);border-color:var(--steel);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:5px}.seg button{font-weight:500;padding:6px 10px}.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.mrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}.mrow b{font-size:15px;flex:0 0 170px}.mrow .note{flex:0 0 190px}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:7px 0;font-size:15px}
.trow .yr{flex:none;min-width:118px;font-size:12px;font-weight:700;background:var(--steel-bg);border-radius:20px;padding:2px 9px}
.trow select{width:auto;flex:1 1 180px;max-width:320px}
.ok1{color:#4C5F2B;font-weight:700}.no1{color:var(--poppy);font-weight:700}
.turns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:10px}
.turn{display:grid;gap:6px;align-content:start;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;cursor:pointer;font-weight:400}
.turn input{position:absolute;opacity:0}.turn:has(input:focus-visible){outline:3px solid var(--steel);outline-offset:2px}
.turn.on{border-color:var(--poppy);background:var(--poppy-bg)}.turn img{width:100%;height:130px;object-fit:cover;border-radius:9px}
.turn b{font-size:17px}.turn p{margin:0;font-size:14px}.turn .yr{justify-self:start;font-size:12px;font-weight:700;background:var(--steel-bg);border-radius:20px;padding:1px 9px}
.noimg{height:130px;border-radius:9px;background:var(--steel-bg);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--steel);font-weight:700}
.exit{font-size:17px;background:var(--paper);border-radius:10px;padding:10px 12px}
.key{display:block;margin-top:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}.cmp>span{display:flex;gap:4px;align-items:center;min-width:0}.cmp select{width:100%;min-width:0}
.chunk{border:none;background:transparent;font:inherit;color:inherit;padding:1px 3px;border-bottom:2px dashed #B9A88C;cursor:pointer;border-radius:3px;text-align:left}.chunk.on{background:#FBE7A3;border-bottom:3px solid var(--poppy)}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('l40x-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('l40x-'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('l40x-'+k)}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const foot=(t,c='poppy')=>`<p class="foot c-${c}">${t}</p>`;
const tile=(t,b,c='')=>`<div class="tile ${c?'t-'+c:''}"><h3>${t}</h3><p>${b}</p></div>`;
const src=n=>(window.IMAGES&&window.IMAGES[n])||`img/${n}.webp`;
const fig=(n,cap,alt)=>`<figure class="fig"><button class="zoom" data-zoom="${src(n)}" aria-label="${alt} 크게 보기"><img src="${src(n)}" alt="${alt}"></button>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
const act=(t,q,a)=>`<div class="act"><div class="tag">${t}</div><h3>${q}</h3><details><summary>답 확인하기</summary><p>${a}</p></details></div>`;
const timer=m=>`<span class="clock">⏱ ${m}분</span>`;
const words=list=>`<div class="words"><div class="words-h">📖 낱말 풀이</div><dl>${list.map(w=>`<div><dt>${w[0]}</dt><dd>${w[1]}${w[2]?`<small>예) ${w[2]}</small>`:''}</dd></div>`).join('')}</dl></div>`;
const easy=t=>`<div class="easy"><b>한 줄로 말하면</b> ${t}</div>`;
const narrow=(h,w=420)=>`<div class="narrow" style="max-width:${w}px">${h}</div>`;
const ROUTES=[['design','수업 설계','교사용'],['charta','학습 교재','CHARTA'],['unio','① 국제 연합','개인·짝 · 8분'],['concilium','② 평화 회복 회의','모둠 · 10분'],['relatio','③ 2026 인권 선언','개인 · 5분'],['arca','④ 형성평가·출구 카드','정리 · 9분'],['teacher','교사용','TEACHER']];
const ESC='arca';
const chainHTML=rows=>`<div class="links">${rows.map((r,i)=>`<div class="link"><span class="yr">${r[0]}</span><p>${r[1]}</p></div>${i<rows.length-1?'<div class="arr" aria-hidden="true">↓</div>':''}`).join('')}</div>`;
/* ---------- 학습 교재 장면 ---------- */
const S={};
S.metaphora=`<h2>축제 부스 싸움이 끝난 뒤,<br><span class="hl">다음 축제는 어떻게 지킬까?</span></h2>
<div class="bubble">지난 시간의 축제 부스 쟁탈전이 끝났다. 부스는 부서지고 1학년 동생들은 다쳤다. 학생회와 각 반 대표가 다시 모였다. “다음 축제에서는 절대 이런 일이 없어야 해.” 무엇부터 해야 할까?</div>
<div class="rows"><div class="row meta-row"><div>다음 축제를 지키는 방법</div><div>제2차 세계 대전 이후</div></div>
${[['예전 축제 규칙은 힘센 반이 빠졌고, 어겨도 막을 방법이 없었다','국제 연맹의 한계'],['싸움 도중, 학생회와 큰 반 대표가 “끝나면 이렇게 하자”고 원칙부터 약속','「대서양 헌장」(1941)'],['축제 운영 위원회를 새로 만들고, 규칙을 어긴 부스를 멈출 힘을 준다','국제 연합(UN)과 안전 보장 이사회'],['부스를 부수고 동생들을 다치게 한 주동자에게 책임을 묻는다. 그런데 이긴 쪽 반의 잘못은 다루지 않았다','전범 재판과 그 한계'],['“모든 학생은 축제를 안전하게 즐길 권리가 있다” 권리 약속문을 붙인다','「세계 인권 선언」(1948)'],['부스를 잃은 반과 다친 동생들에게 재료와 지원금을 나눠 준다','사회 보장과 복지의 확대']].map(r=>`<div class="row"><div>${r[0]}</div><div>${r[1]}</div></div>`).join('')}</div>
<p>비유에는 한계도 있다. 실제 전쟁은 수천만 명의 목숨을 앗아 갔고, 그 상처는 지원금 몇 푼으로 회복될 수 없었다. 비유는 전쟁 뒤 세계가 무엇을 했는지 정리하는 데까지만 쓴다.</p>
${foot('싸움을 멈추는 규칙, 책임지는 절차, 모두의 권리, 함께 사는 지원','brass')}`;

S.s1=`<h2>국제 연맹에서<br>국제 연합으로</h2>
${easy('국제 연맹은 힘이 없어 전쟁을 막지 못했다. 그래서 전쟁 중에 미국과 영국이 「대서양 헌장」으로 평화 원칙을 약속했고, 전쟁이 끝난 1945년 군대를 보낼 수 있는 국제 연합(UN)이 만들어졌다.')}
${chainHTML([['1920','<b>국제 연맹</b> 창설 → 미국 등 강대국 불참, 침략을 막을 군사적 수단 없음'],['1941','미국·영국이 <b>「대서양 헌장」</b> 발표 → 전후 평화 원칙, 새 국제 평화 기구 설립 제안'],['1943~45','<b>카이로 회담, 얄타 회담, 포츠담 회담</b> → 전후 처리 문제와 새 국제기구 설립 논의'],['1945','<b>국제 연합(UN)</b> 창설, 「국제 연합 헌장」 채택']])}
<div class="g2"><div class="tile t-steel"><h3>국제 연맹 (1920)</h3><p>미국 등 강대국이 불참했다.<br>침략을 막을 군사적 수단이 없었다.<br>→ 제2차 세계 대전을 막지 못했다.</p></div>
<div class="tile t-olive"><h3>국제 연합 (1945)</h3><p>미국, 영국, 소련 등 강대국이 참여했다.<br><b>안전 보장 이사회</b>의 결정에 따라 <b>국제 연합군(유엔군)</b>을 보내 분쟁에 개입할 수 있다.<br>→ 무력 제재 수단이 생겼다.</p></div></div>
<div class="source"><div class="lab">「국제 연합 헌장」 · 교과서 2 p.216</div><p>우리는 …… 전쟁의 불행에서 다음 세대를 구하고, 기본적 인권, 인간의 존엄 및 가치, 남녀 및 각국의 평등권에 대한 신념을 재확인하며, …… 더 많은 자유 속에서 사회적 진보와 생활 수준의 향상을 촉진할 것을 결의했다.</p></div>
${words([['헌장','나라나 단체가 지킬 원칙을 정해 널리 알린 글.'],['안전 보장 이사회','국제 분쟁을 조정하고 중재하는 국제 연합의 핵심 기구. 미국, 영국, 프랑스, 러시아(당시 소련), 중국이 상임 이사국이다.'],['제재','규칙을 어긴 쪽에 불이익을 주어 멈추게 하는 것.']])}
${foot('비유로 보면, 힘없던 예전 규칙 대신 부스를 멈출 수 있는 운영 위원회를 만든 것','steel')}`;

S.s2=`<h2>전쟁 범죄에<br>책임을 묻다</h2>
${easy('전쟁이 끝나자 연합국은 민간인을 대규모로 해친 범죄를 ‘반인도적 범죄’라 부르고, 독일과 일본의 전쟁 책임자를 국제 재판에 세웠다. 하지만 처벌에서 빠진 사람들도 있었다.')}
<div class="g2"><div class="tile t-steel">${fig('nuremberg','뉘른베르크 국제 군사 재판(1945~1946)','헬멧을 쓴 헌병들 앞, 피고인석에 줄지어 앉은 나치 전범들의 사진')}<p>· 주요 나치 전범 24명 기소<br>· 괴링 등 12명 사형, 헤스 등 3명 종신형<br>· 나치의 만행이 온 세상에 드러남<br>· 민간인 대상의 비인간적 행위를 <b>‘반인도적 범죄’</b>로 규정</p></div>
<div class="tile t-poppy">${fig('tokyo','극동 국제 군사 재판(1946~1948)','도쿄 재판정의 피고인석에 선 일본 전범들의 사진')}<p>· 주요 일본 전범 28명 기소<br>· 도조 히데키 등 7명 사형, 16명 종신형<br>· <b>히로히토 천황 등 고위급 전범 대부분 책임 면제</b><br>· <b>731부대의 생체 실험도 처벌받지 않음</b></p></div></div>
<div class="tile t-brass"><h3>두 재판의 공통 한계</h3><p>승전국들의 전쟁 범죄는 재판 대상이 되지 않았다. 전쟁에서 이긴 쪽이 진 쪽을 심판한 재판이었다.</p></div>
${words([['반인도적 범죄','인간의 존엄에 반하는 행위. 민간인 학살, 노예화, 강제 이송, 정치·인종·종교를 이유로 한 박해 등.'],['기소','검사가 범죄를 저지른 사람을 재판에 넘기는 것.'],['731부대','일본군이 중국에서 사람을 대상으로 생체 실험을 한 부대.']])}
${act('탐구 ①','제2차 세계 대전 이후 열린 전범 재판의 효과와 한계를 이야기해 보자.','효과: 전쟁 범죄를 국제 재판으로 처벌한 첫 사례로, ‘반인도적 범죄’라는 기준을 만들고 나치의 만행을 세상에 알렸다. 한계: 도쿄 재판에서 천황과 731부대가 책임을 면했고, 두 재판 모두 승전국의 범죄는 다루지 않았다.')}
${foot('비유로 보면, 주동자에게 책임을 물었지만 이긴 쪽 반의 잘못은 다루지 않은 것','poppy')}`;

S.s3=`<h2>모든 사람의 권리,<br>「세계 인권 선언」</h2>
${easy('국제 연합은 전쟁 중의 인권 침해를 반성하며 1948년 「세계 인권 선언」을 채택했다. 누구나 차별 없이 자유롭고 평등하다는 것, 그리고 인간다운 삶을 위해 사회 보장을 요구할 권리(사회권)까지 담았다.')}
<div class="side">${fig('eleanor','「세계 인권 선언」과 엘리너 루스벨트(1949). 국제 연합 인권 위원회 위원장으로 선언 작성을 주도했다.','커다란 세계 인권 선언 포스터를 펼쳐 든 엘리너 루스벨트의 사진')}
<div class="source"><div class="lab">「세계 인권 선언」 중 일부 · 교과서 1 p.191, 교과서 2 p.217</div><p><b>제1조</b> 모든 인간은 태어날 때부터 자유롭고, 누구에게나 동등한 존엄성과 권리가 있다.<br><b>제2조</b> 모든 사람은 인종, 피부색, 성별, 언어, 종교, 정치적 견해 등 어떤 구분도 없이 이 선언의 권리와 자유를 누릴 자격이 있다.<br><b>제21조</b> 모든 사람은 직접 참여하든 선거를 통해서든 정치에 참여할 권리가 있다.<br><b>제23조</b> 모든 사람은 노동할 권리가 있다.<br><b>제25조 1항</b> 모든 사람은 의식주, 의료, 사회 복지를 포함해 자신과 가족의 건강과 안녕에 적합한 생활 수준을 누릴 권리가 있다. ……<br><b>제26조</b> 모든 사람은 교육받을 권리가 있다.<br><b>제29조</b> 모든 사람은 자신이 속한 공동체에 대하여 의무를 진다.</p></div></div>
${words([['인권','사람이라면 누구나 태어날 때부터 가지는 기본 권리.'],['사회권','인간다운 삶을 위해 필요한 사회 보장을 요구할 수 있는 권리.','아프거나 일자리를 잃었을 때 나라에 도움을 요구할 권리'],['채택','여럿 가운데 골라서 정식으로 받아들이는 것.']])}
<p class="note">이 선언의 정신은 많은 나라의 헌법에 반영되었다. 대한민국 헌법의 기본권 조항에도 이어진다.</p>
${foot('비유로 보면, “모든 학생은 축제를 안전하게 즐길 권리가 있다”는 약속문','olive')}`;

S.s4=`<h2>“요람에서<br>무덤까지”</h2>
${easy('대공황과 전쟁을 겪은 사람들은 실업 급여와 사회 보험을 요구했다. 각 나라 정부는 이를 받아들였고, 영국은 태어나서 죽을 때까지 나라가 생활을 돌본다는 복지 국가를 내세웠다.')}
<div class="side">${fig('family','가족 수당을 받는 영국인들(1946)','창구 앞에서 수당을 받는 어머니와 아이들의 사진')}
<div>${chainHTML([['대공황','생활이 어려워진 사람들이 실업 급여, 사회 보험 등을 요구'],['정부','대공황 극복, 자본주의 체제 유지를 위해 요구를 받아들임'],['노동자','<b>단결권, 단체 교섭 및 행동권, 최저 임금제</b> 등 확보'],['영국','전쟁 중 <b>복지 국가</b> 이념 제시, “요람에서 무덤까지” → 전쟁 뒤 여러 나라의 복지 정책에 영향']])}</div></div>
<div class="tile t-brass"><h3>각 나라가 복지 정책을 시행한 까닭은?</h3><p>사람들은 경제를 시장의 흐름에만 맡겨 둘 수 없다는 것을 알게 되었다. 경제학자 케인스는 국가가 계획적으로 경제에 개입해 일자리를 늘리고 더 평등한 사회를 만들어야 한다고 주장했다. 이 생각이 퍼지면서 각 나라 정부는 실업자와 빈곤한 사람들을 위한 복지 정책을 정비하고 일자리를 만들었다. 이는 전쟁 이후 자본주의가 크게 성장하는 밑거름이 되었다.</p></div>
${words([['복지 국가','국민의 생존권을 보장하고, 복지와 행복을 중요한 임무로 삼는 국가.'],['요람','갓난아기를 태워 놀게 하는 물건. “요람에서 무덤까지”는 태어나서 죽을 때까지라는 뜻.'],['최저 임금제','일한 사람에게 법으로 정한 금액 이상을 주도록 한 제도.']])}
<p class="note">2026년 우리 주변의 건강 보험, 아동 수당, 무상 급식, 최저 임금도 이 흐름과 이어져 있다.</p>
${foot('비유로 보면, 부스를 잃은 반과 다친 동생들에게 재료와 지원금을 나눠 준 것','brass')}`;

S.s5=`<h2>더 알아보기:<br>화해를 위한 노력</h2>
${easy('재판과 선언 뒤에도, 전쟁의 상처를 치유하려면 가해국의 진심 어린 사과와 서로의 역사를 함께 배우는 노력이 필요했다.')}
<div class="g2"><div class="tile">${fig('brandt','유대인 희생자 추모비 앞에서 무릎 꿇은 서독의 브란트 총리(1970)','추모비 앞 화환 옆에서 무릎을 꿇은 브란트 총리와 사진 기자들의 사진')}<p>제2차 세계 대전 중 피해를 가장 많이 입은 폴란드를 찾은 브란트 총리는 독일 국민을 대표해 무릎을 꿇고 사죄했다.</p></div>
<div class="tile">${fig('textbook','독일·프랑스 공동 역사 교과서 프랑스어판(왼쪽)과 독일어판(오른쪽)','빨간 표지의 두 역사 교과서 사진')}<p>2003년 프랑스·독일 청소년 의회의 제안으로 두 나라가 3년 동안 함께 만든 역사 교과서가 나왔다(2006).</p></div></div>
${act('탐구 ②','독일과 일본은 전후 과거사에 어떤 태도를 보였는지 검색해 보자. 추천 검색어: 독일 과거사 반성, 일본 과거사 반성, 야스쿠니 신사 참배','검색 결과는 출처(누가, 언제 쓴 글인지)를 함께 적자. 같은 사건도 어느 나라 언론이냐에 따라 다르게 쓸 수 있다.')}
${foot('처벌과 선언만으로는 부족했다. 사과와 함께 배우기','steel')}`;

S.tabula=`<h2>전쟁이 끝난 뒤,<br>세계가 한 일 네 가지</h2>
<div class="arrows"><div class="arrow a2">평화를 지킬 기구</div><div class="arrow a1">전쟁 범죄의 책임</div><div class="arrow a4">모두의 인권</div><div class="arrow a3">사회 보장과 복지</div></div>
<div class="rows"><div class="row meta-row"><div>구분</div><div>핵심 내용</div></div>
<div class="row"><div>국제기구</div><div>국제 연맹의 한계(강대국 불참, 군사적 수단 없음) → 「대서양 헌장」(1941) → 카이로·얄타·포츠담 회담 → 국제 연합(1945), 안전 보장 이사회, 국제 연합군</div></div>
<div class="row"><div>전범 재판</div><div>‘반인도적 범죄’ 규정 → 뉘른베르크 재판(1945~1946), 극동 국제 군사 재판(1946~1948) / 한계: 천황·731부대 면책, 승전국 범죄 제외</div></div>
<div class="row"><div>인권</div><div>「세계 인권 선언」(1948): 차별 없는 평등, 인권 강조, 사회권 포함 → 여러 나라 헌법에 반영</div></div>
<div class="row"><div>복지</div><div>단결권, 단체 교섭 및 행동권, 최저 임금제 / 영국의 복지 국가 “요람에서 무덤까지” → 전후 자본주의 성장의 밑거름</div></div></div>
${act('함께 확인해요','제2차 세계 대전 이후 새로운 국제 평화 기구인 (        )이/가 만들어졌다.','국제 연합(UN)')}`;


/* ---------- MYP 45분: 학습 교재 순서 ---------- */
const SOI='전쟁의 비극을 겪은 국제 사회는 이전 체제의 한계를 보완하는 협력의 틀과 인권의 기준을 만들어 평화를 지키려 하지만, 그 정의는 누가 판단하느냐에 따라 한계를 가진다.';
S.s1m=`<h2>평화 논의의 흐름,<br>네 번의 약속</h2>
${easy('「대서양 헌장」에서 새 국제기구를 제안했고, 세 번의 회담을 거쳐 1945년 국제 연합이 세워졌다. 카이로 회담은 한국의 독립을 처음으로 약속한 회담이다.')}
<div class="rows"><div class="row meta-row"><div>회담</div><div>참가국 · 내용</div></div>
<div class="row"><div>「대서양 헌장」<br><small>1941. 8.</small></div><div>미국, 영국 · 전후 평화 수립 원칙, 새로운 국제 평화 기구 설립 제안</div></div>
<div class="row"><div>카이로 회담<br><small>1943. 11.</small></div><div>미국, 영국, 중국 · <b>한국 독립을 처음 약속</b></div></div>
<div class="row"><div>얄타 회담<br><small>1945. 2.</small></div><div>미국, 영국, 소련 · 전후 독일 처리 논의, 소련의 대일전 참전 결정</div></div>
<div class="row"><div>포츠담 회담<br><small>1945. 7.</small></div><div>미국, 영국, 소련 · 전후 문제 논의, <b>한국 독립 재확인</b>, 일본의 항복 촉구</div></div></div>
<p class="note">교사용 190쪽 ‘전후 처리 문제를 위한 회담들’ 표를 옮겼다. 1945년 샌프란시스코 회의에서 국제 연합 창설이 결정되었다.</p>
${foot('약속 네 번 끝에 국제 연합','steel')}`;
S.s4m=S.s4.replace(/<p class="foot[^]*$/,'');
const STEPS=[['도입 · 5분',`<div class="chips"><span class="chip">CHARTA · 도입</span></div><h2>저 사람들은 누구이고,<br>왜 재판을 받고 있을까?</h2>
${fig('nuremberg','뉘른베르크 국제 군사 재판(1945~1946)','피고인석에 앉은 나치 전범들과 뒤에 선 헌병들의 사진')}
<div class="tile t-brass"><h3>질문 발표</h3><p>① 사진 속 사람들은 누구일까? ② 왜 재판을 받고 있을까? ③ 지난 시간, 전쟁은 어떻게 끝났지? (1945년 5월 독일 항복, 8월 일본 항복)</p></div>

  const c=T.view;
  body=`<div class="board-top"><h3>${clsName(c)} · 7모둠 중 ${cnt(c)}모둠 제출</h3></div>
  ${cnt(c)?'':`<div class="diag">${clsName(c)}의 제출물이 아직 없다. 시트 전체 제출물은 ${it.length}건이다.${unknown.length?` 반을 알 수 없는 글 ${unknown.length}건은 ‘전체 현황’ 아래에 있다.`:''}</div>`}
  <div class="pad">${GROUPS.map(g=>{const l=list(c,g);return l.length?card(l[0],g,l.slice(1)):`<article class="pcard empty" style="--gc:${GC[(g-1)%7]}"><header><b>모둠 ${g}</b></header><p>아직 제출하지 않았어요</p></article>`}).join('')}</div>`;
 }
 return head+`<section class="slide wide">${tabs}${body}</section>`}
async function loadBoard(){T.err='';T.errLink=false;
 if(!SYNC_URL){T.items=store.get('subs',[]).map(x=>({...x,raw:x.cls,cls:normCls(x.cls),grp:normGrp(x.grp)}));render();return}
 const k=$('#tkey');if(k)T.key=k.value;if(!T.key){T.err='교사 암호를 입력하세요.';render();return}
 T.loading=true;render();
 try{const a=await post({action:'list',key:T.key});
  if(a&&a.ok){T.items=(a.items||[]).map(x=>({...x,raw:x.cls,cls:normCls(x.cls),grp:normGrp(x.grp)}))}else{T.items=null;T.err=a&&a.error==='wrong_key'?'암호가 맞지 않습니다. 다시 입력하세요.':a&&a.error==='key_not_set'?'apps-script.gs의 KEY를 교사 암호로 바꾼 뒤 새 버전으로 배포하세요.':'게시물을 불러오지 못했습니다. 잠시 뒤 다시 시도하세요.'}
 }catch(x){const up=urlProblem();T.err=up?'서버 주소 문제: '+up:x&&x.html?'서버가 데이터 대신 웹 페이지를 보냈다. apps-script.gs를 편집기에 통째로 붙여 넣었는지(function myFunction 안에 넣지 않았는지) 확인하고, 배포 관리 → 수정 → 버전 ‘새 버전’으로 다시 배포하세요.':'서버에 연결하지 못했습니다. 아래 ‘서버 주소 직접 열어 보기’를 눌러 결과를 확인하세요.';T.errLink=true}
 T.loading=false;render()}
function bindTeacher(){
 $('#tform').onsubmit=e=>{e.preventDefault();loadBoard()};
 document.querySelectorAll('[data-tv]').forEach(b=>b.onclick=()=>{T.view=b.dataset.tv;render()})}

/* ---------- 라우팅 ---------- */
let route='design';
function render(){
 $('#nav').innerHTML=ROUTES.map(r=>`<button data-go="${r[0]}" ${r[0]===route?'aria-current="page"':''}><small>${r[2]}</small>${r[1]}</button>`).join('');
 let h='';
 if(route==='design')h=CARDS.map((c,i)=>`<section class="slide"><div class="no">${i+1} / ${CARDS.length}</div>${c}</section>`).join('');
 if(route==='charta')h=chartaHTML();
const ESCR=typeof ESC==='string'?ESC:ROUTES[3][0];const PG=typeof PAGES!=='undefined'?PAGES:{};
 if(PG[route])h=PG[route].html();
 if(route==='fontes')h=`<section class="slide">${S.fontes}</section><div><button class="btn" data-go="${ROUTES[3][0]}">다음: ${ROUTES[3][1]}</button></div>`;
 if(route===ESCR)h=escapeHTML();
 if(route==='relatio')h=relatioHTML();
 if(route==='concilium')h=conciliumHTML();
 if(route==='teacher')h=teacherHTML();
 $('#app').className=route==='teacher'?'wide':'';
 $('#app').innerHTML=`<div class="view">${h}</div>`;
 if(PG[route])PG[route].bind();if(route===ESCR)bindEscape();if(route==='relatio')bindRelatio();if(route==='concilium'){if(conTab==='submit')bindSubmit();else bindConcilium()}if(route==='teacher')bindTeacher();
}
function go(r){if(location.hash!=='#'+r)location.hash=r;else{route=r;render()}window.scrollTo(0,0)}
const lb=$('#lb');lb.onclick=()=>{lb.hidden=true};addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){lb.querySelector('img').src=z.dataset.zoom;lb.querySelector('img').alt=z.querySelector('img').alt;lb.hidden=false;lb.focus();return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const con=e.target.closest('[data-con]');if(con){conTab=con.dataset.con;render();return}const s=e.target.closest('[data-step]');if(s&&!s.disabled){step=+s.dataset.step;render();window.scrollTo(0,0)}});
function fromHash(){const h=location.hash.slice(1);route=ROUTES.some(r=>r[0]===h)?h:'design';render()}
addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
